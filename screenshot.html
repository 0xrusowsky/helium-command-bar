<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Screenshot</title>
    <link rel="stylesheet" href="screenshot.css">
  </head>
  <body>
    <header>
      <h1>Screenshot</h1>
      <span id="status" role="status"></span>
      <button id="copy" type="button">Copy</button>
      <a id="save" download="screenshot.png">Save</a>
    </header>
    <main>
      <img id="image" alt="Screenshot of the visible page area">
    </main>
    <script type="module" src="screenshot.js"></script>
  </body>
</html>
